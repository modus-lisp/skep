name: gates
on: [push, pull_request]

# ONE PLATFORM: pure Common Lisp, no FFI, no platform calls.
#
# skep is not an ASDF system — it has no .asd at all, and load.lisp loads its sources
# in order.  Its suite is test/run.sh, which runs six oracles and exits non-zero if any
# fails.  That already existed and was already green; nothing was running it.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: skep
          submodules: recursive

      # skep signs with modus-lisp's secp256k1-fast (keys in natrium's gossamer
      # memory).  src/deps.lisp finds those beside the checkout, so clone them there.
      - name: Sibling checkouts
        run: |
          for repo in natrium secp256k1-fast json-simple; do
            git clone --depth 1 -q https://github.com/modus-lisp/$repo.git "$repo"
          done
      - name: Install SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbcl

      # skep's sources load quicklisp themselves — src/skep.lisp does
      # (load "~/quicklisp/setup.lisp") and quickloads its libraries — so the runner
      # has to have one.  That is why the suite passed on every developer machine and
      # nowhere else: the init file had already done it.  The list mirrors the
      # quickloads in src/skep.lisp and src/nostr.lisp; quicklisp
      # resolves their own dependencies from there.
      - name: Quicklisp dependencies
        run: |
          # RETRIED, because this is the one step that reaches the network and a
          # transient failure here is indistinguishable from a broken repository.
          # loom went red on "Connection reset by peer" mid-install and was diagnosed
          # as having a non-hermetic test suite; it did not, and its suite never ran.
          # A badge that goes red on somebody else's CDN teaches people to ignore it.
          for attempt in 1 2 3; do
            rm -rf ~/quicklisp
            curl -sSLo /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp || { sleep 5; continue; }
            sbcl --non-interactive --load /tmp/quicklisp.lisp \
                 --eval '(quicklisp-quickstart:install :path "~/quicklisp/")' \
                 --eval '(ql-util:without-prompting (ql:add-to-init-file))' && break
            echo "quicklisp install attempt $attempt failed; retrying"
            sleep 10
          done
          # json-simple is a modus-lisp sibling, not on Quicklisp: local-projects.
          ln -s "$GITHUB_WORKSPACE/json-simple" ~/quicklisp/local-projects/json-simple
          sbcl --non-interactive --eval '(ql:quickload (list :usocket :fast-websocket :cl-ppcre :ironclad :cl-base64 :json-simple :bordeaux-threads :websocket-driver-client))'

      - name: Oracles
        working-directory: skep
        run: bash test/run.sh
